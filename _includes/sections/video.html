{%- assign video = site.data.paper.video -%}
<section class="video" id="video">
  <h2 class="section-title">Video</h2>
  <div class="card">
    {%- if video.src %}
    <div class="video-frame video-embed">
      <video id="project-video" controls preload="metadata" playsinline
             {% if video.poster %}poster="{{ video.poster | relative_url }}"{% endif %}
             aria-label="{{ video.title | default: 'Project video' }}">
        <source src="{{ video.src | relative_url }}" type="video/mp4">
      </video>
    </div>
    {%- if video.chapters %}
    <div class="video-chapters" id="video-chapters" aria-label="Video chapters">
      {%- for c in video.chapters %}
      <button type="button" data-t="{{ c.t }}"><span class="t">{{ c.t }}</span>{{ c.label }}</button>
      {%- endfor %}
    </div>
    <script src="{{ '/assets/js/video-chapters.js' | relative_url }}" defer></script>
    {%- endif %}
    {%- elsif video.youtube_id %}
    <div class="video-frame video-embed">
      <iframe src="https://www.youtube-nocookie.com/embed/{{ video.youtube_id }}?rel=0"
              title="{{ video.title | default: 'Project video' }}"
              loading="lazy"
              allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
    </div>
    {%- else %}
    <div class="video-frame">
      <div class="play-btn">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>
    </div>
    <div class="video-caption placeholder">Video coming soon.</div>
    {%- endif %}
  </div>
</section>
