<!-- Overview figure (redrawn from Fig. "Overview of the proposed framework").
     Blocks with data-step are clickable and drive the demo next to it. -->
<svg class="ov" viewBox="0 0 470 808" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Framework overview">
  <defs>
    <marker id="ov-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="ov-head"/>
    </marker>
  </defs>

  <!-- connections -->
  <g class="ov-wires" marker-end="url(#ov-arrow)">
    <path d="M84 78 V96"/>
    <path d="M84 172 V198"/>
    <path d="M84 182 H352 V198"/>
    <path d="M234 78 V350"/>
    <path d="M234 135 H180 V198"/>
    <path d="M398 78 V198"/>
    <path d="M150 286 V350"/>
    <path d="M210 772 V800"/>
  </g>
  <g class="ov-labels">
    <text x="30" y="194">z<tspan dy="4" font-size="10">env</tspan></text>
    <text x="36" y="322">s<tspan dy="4" font-size="10">i</tspan><tspan dy="-4"> → p̃</tspan><tspan dy="4" font-size="10">i</tspan><tspan dy="-4">, WGR</tspan><tspan dy="4" font-size="10">i</tspan></text>
    <text x="404" y="340">q<tspan dy="4" font-size="10">t</tspan></text>
    <text x="452" y="340">q<tspan dy="4" font-size="10">g</tspan></text>
    <text x="222" y="796" class="ov-plain">Path</text>
  </g>

  <!-- inputs -->
  <g class="ov-input">
    <rect x="8" y="8" width="152" height="70" rx="10"/>
    <text x="84" y="36" text-anchor="middle">RGB &amp; Depth</text>
    <text x="84" y="60" text-anchor="middle">x<tspan dy="4" font-size="10">rgb</tspan><tspan dy="-4">, x</tspan><tspan dy="4" font-size="10">depth</tspan></text>
  </g>
  <g class="ov-input">
    <rect x="168" y="8" width="132" height="70" rx="10"/>
    <text x="234" y="48" text-anchor="middle">WGR<tspan dy="4" font-size="11">i</tspan></text>
  </g>
  <g class="ov-input">
    <rect x="330" y="8" width="132" height="70" rx="10"/>
    <text x="396" y="36" text-anchor="middle">Start Config</text>
    <text x="396" y="60" text-anchor="middle">q<tspan dy="4" font-size="10">s</tspan></text>
  </g>
  <g class="ov-encoder">
    <rect x="8" y="96" width="152" height="76" rx="12"/>
    <text x="84" y="128" text-anchor="middle">Environment</text>
    <text x="84" y="152" text-anchor="middle">Encoder</text>
  </g>

  <!-- step 1 -->
  <g class="ov-click ov-scoring" data-step="1" tabindex="0" role="button" aria-label="Step 1: Reachability scoring">
    <rect class="ov-box" x="8" y="198" width="218" height="88" rx="14"/>
    <text x="117" y="236" text-anchor="middle" font-size="21">Reachability Scoring</text>
    <text x="117" y="268" text-anchor="middle" font-size="14.5">s<tspan dy="3" font-size="9">i</tspan><tspan dy="-3"> = f</tspan><tspan dy="3" font-size="9">ϕ</tspan><tspan dy="-3">(z</tspan><tspan dy="3" font-size="9">env</tspan><tspan dy="-3">, WGR</tspan><tspan dy="3" font-size="9">i</tspan><tspan dy="-3">) ∈ [0,1]</tspan></text>
  </g>

  <!-- step 2 -->
  <g class="ov-click ov-diffusion" data-step="2" tabindex="0" role="button" aria-label="Step 2: Diffusion path sampling">
    <rect class="ov-box" x="244" y="198" width="218" height="88" rx="14"/>
    <text x="353" y="228" text-anchor="middle" font-size="21">Diffusion Path</text>
    <text x="353" y="251" text-anchor="middle" font-size="21">Sampler</text>
    <text x="353" y="277" text-anchor="middle" font-size="14.5">π<tspan dy="3" font-size="9">θ</tspan><tspan dy="-3">(q</tspan><tspan dy="3" font-size="9">t</tspan><tspan dy="-3"> | q</tspan><tspan dy="3" font-size="9">s</tspan><tspan dy="-3">, q</tspan><tspan dy="3" font-size="9">g</tspan><tspan dy="-3">, z</tspan><tspan dy="3" font-size="9">env</tspan><tspan dy="-3">)</tspan></text>
  </g>

  <!-- step 3 -->
  <g class="ov-click ov-planner" data-step="3" tabindex="0" role="button" aria-label="Step 3: Tree expansion">
    <rect class="ov-box" x="10" y="350" width="446" height="422" rx="26"/>
    <text class="ov-planner-title" x="226" y="384" text-anchor="middle" font-size="21">Sampling-based Tree Planner</text>
    <rect class="ov-inner" x="24" y="402" width="384" height="344" rx="16"/>
    <text class="ov-on-dark" x="216" y="432" text-anchor="middle" font-size="17">Tree Growth Iteration</text>

    <g class="ov-sub" data-live="select">
      <rect x="52" y="456" width="316" height="46" rx="23"/>
      <text x="210" y="484" text-anchor="middle">Select Samples Type</text>
    </g>
    <g class="ov-sub" data-live="uniform">
      <rect x="62" y="528" width="138" height="50" rx="8"/>
      <text x="131" y="558" text-anchor="middle">Uniform</text>
    </g>
    <g class="ov-sub" data-live="goal">
      <rect x="258" y="520" width="136" height="60" rx="8"/>
      <text x="326" y="545" text-anchor="middle">Goal-Biased</text>
      <text x="326" y="568" text-anchor="middle">(q<tspan dy="4" font-size="10">g</tspan><tspan dy="-4">)</tspan></text>
    </g>
    <g class="ov-sub" data-live="goal">
      <rect x="260" y="598" width="132" height="56" rx="8"/>
      <text x="326" y="622" text-anchor="middle">Query</text>
      <text x="326" y="644" text-anchor="middle">Diffusion</text>
    </g>
    <g class="ov-sub" data-live="expand">
      <rect x="52" y="674" width="316" height="46" rx="10"/>
      <text x="210" y="702" text-anchor="middle">Collision-check &amp; Expand Tree</text>
    </g>
  </g>

  <!-- inner arrows drawn above the planner block -->
  <g class="ov-wires ov-wires-inner" marker-end="url(#ov-arrow)">
    <path d="M131 502 V526"/>
    <path d="M310 502 V518"/>
    <path d="M326 580 V596"/>
    <path d="M131 578 V672"/>
    <path d="M326 654 V672"/>
    <path d="M426 286 V620 H396"/>
    <path d="M392 636 H446 V290"/>
  </g>
</svg>
